port: /dev/ttyS4
baud_rate: 115200
wheel_diameter: 0.165
wheel_spacing: 0.42
max_linear_speed: 1.5
max_angular_speed: 1.5
odom_frame: odom
base_frame: base_link
odom_topic: /wheel_odom
imu_topic: /imu/data
