# 奥比中光大白 DW 系列 ×2（USB）。驱动：OrbbecSDK_ROS1 → orbbec_camera
# 安装：scripts/install_third_party.sh

driver_package: orbbec_camera
launch_file: dabai_dw.launch

camera1:
  namespace: camera
  # orbbec 默认点云多为 /camera/depth/points
  driver_cloud_topic: depth/points
  points_topic: /camera/depth/points_cam
  usb_port: ""          # 填 lsusb -t 或 udev 规则，例如 2-1.1
  serial_number: ""

camera2:
  namespace: camera2
  driver_cloud_topic: depth/points
  points_topic: /camera2/depth/points_cam
  usb_port: ""
  serial_number: ""

depth_width: 640
depth_height: 480
depth_fps: 15
enable_point_cloud: true
enable_depth: true
